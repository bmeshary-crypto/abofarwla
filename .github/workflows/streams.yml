name: Check PRIME TV channels

on:
  schedule:
    - cron: '0 2 * * *'   # daily, 5 AM Saudi time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-streams.mjs
      - name: Commit prime.m3u
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prime.m3u
          git diff --cached --quiet || git commit -m "Update working PRIME TV channels"
          git pull --rebase
          git push
