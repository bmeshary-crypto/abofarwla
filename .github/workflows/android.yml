name: Build Android app

on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # the same key every time, so the in-app update can install over the old version
      - name: Decode the signing key
        if: env.APP_KEY_PASSWORD != ''
        run: |
          echo "${{ secrets.APP_KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/app-key.p12"
          echo "APP_KEYSTORE_FILE=$RUNNER_TEMP/app-key.p12" >> "$GITHUB_ENV"
      - name: Build (signed)
        if: env.APP_KEY_PASSWORD != ''
        working-directory: android
        run: |
          gradle assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../AbuFarawla-TV.apk
      - name: Build (test copy, no signing key)
        if: env.APP_KEY_PASSWORD == ''
        working-directory: android
        run: |
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../AbuFarawla-TV.apk
      - name: Upload to the app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view app >/dev/null 2>&1 || gh release create app --title "تطبيق أبو فراولة TV" --notes "ويندوز وأندرويد"
          gh release upload app AbuFarawla-TV.apk --clobber
          # read by the app's "check for updates" button; uploaded last so it never names an APK that isn't there yet
          echo "{\"code\": $((100 + GITHUB_RUN_NUMBER)), \"name\": \"1.$GITHUB_RUN_NUMBER\", \"apk\": \"AbuFarawla-TV.apk\"}" > android-version.json
          gh release upload app android-version.json --clobber
