name: Update YouTube movies

on:
  schedule:
    - cron: '0 3 * * *'   # daily, 6 AM Saudi time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-youtube.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY || secrets.YOUTU }}
      - name: Commit yt.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yt.json
          git diff --cached --quiet || git commit -m "Update YouTube movies list"
          git push
